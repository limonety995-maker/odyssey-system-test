name: Build CE-VEE WeaponPod Fix

on:
  push:
    branches:
      - tmp-ce-vee-weaponpod-fix-build
    paths:
      - '.tmp/ce-vee-weaponpod-fix/**'
      - '.github/workflows/build-ce-vee-weaponpod-fix.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.tmp/ce-vee-weaponpod-fix/**'
      - '.github/workflows/build-ce-vee-weaponpod-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .tmp/ce-vee-weaponpod-fix/CEVEEWeaponPodFix.csproj

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build .tmp/ce-vee-weaponpod-fix/CEVEEWeaponPodFix.csproj -c Release --no-restore > build.log 2>&1
          status=$?
          tail -n 120 build.log
          exit $status

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CE-VEE-build-log
          path: build.log
          if-no-files-found: warn

      - name: Package mod
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.tmp/ce-vee-weaponpod-fix"
          STAGE="$GITHUB_WORKSPACE/dist/CE-VEE WeaponPod Compatibility Fix"
          mkdir -p "$STAGE/Assemblies" "$STAGE/About"
          cp "$ROOT/bin/Release/net472/Alik.CEVEEWeaponPodFix.dll" "$STAGE/Assemblies/"
          cp "$ROOT/mod/About/About.xml" "$STAGE/About/"
          cp "$ROOT/mod/README_RU.txt" "$STAGE/"
          cp "$ROOT/CEVEEWeaponPodFix.cs" "$STAGE/CEVEEWeaponPodFix.cs"
          cd "$GITHUB_WORKSPACE/dist"
          zip -r CE_VEE_WeaponPod_Compatibility_Fix_1.6.zip "CE-VEE WeaponPod Compatibility Fix"

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: CE_VEE_WeaponPod_Compatibility_Fix_1.6
          path: dist/CE_VEE_WeaponPod_Compatibility_Fix_1.6.zip
          if-no-files-found: error
